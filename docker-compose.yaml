services:
  ### POLLY POCKET ###

  ## Octoeverywhere ##
  octoeverywhere-polly-pocket:
    image: ${OCTOEVERYWHERE_IMAGE}
    restart: ${RESTART}
    container_name: octoeverywhere-polly-pocket
    environment:
      - COMPANION_MODE=${BAMBU_COMPANION_MODE:-bambu}
      - ACCESS_CODE=${POLLY_POCKET_ACCESS_CODE:-37086528}
      - SERIAL_NUMBER=${POLLY_POCKET_SERIAL_NUMBER:-0309CA580403653}
      - PRINTER_IP=${POLLY_POCKET_PRINTER_IP:-192.168.1.219}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${POLLY_POCKET_DATA_PATH:-/mnt/user/appdata/octoeverywhere/polly}:/data:rw
  
  ## Octoapp Plugin ##
  octoapp-plugin-polly-pocket:
    container_name: octoapp-plugin-polly-pocket
    image: ${OCTOAPP_PLUGIN_IMAGE}
    restart: ${RESTART}
    environment:
      - COMPANION_MODE=${BAMBU_COMPANION_MODE:-bambu}
      - ACCESS_CODE=${POLLY_POCKET_ACCESS_CODE:-37086528}
      - SERIAL_NUMBER=${POLLY_POCKET_SERIAL_NUMBER:-0309CA580403653}
      - PRINTER_IP=${POLLY_POCKET_PRINTER_IP:-192.168.1.219}
      - TZ=${TZ:-America/New_York}
